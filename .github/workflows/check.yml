name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . ruff==0.17.4
      - run: ruff check src tests scripts integrations/codex
      - run: ruff format --check src tests scripts integrations/codex
      - run: python -m unittest discover -s tests -v
      - run: python scripts/evaluate.py
      - run: python scripts/check_package.py
